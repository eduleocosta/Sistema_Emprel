<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo_pagina %}RG Solicitados{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    {% block links_extras %}{% endblock %}
</head>
<body>
    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-12">
                <div class="card mb-3">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center justify-content-between gap-3">
                            <div class="d-flex align-items-center gap-3">
                                <img src="/static/img/conecta_recife.png" alt="Logo" style="height:50px;" onerror="this.style.display='none'">
                                <div>
                                    <div class="fw-bold">EMPRESA MUNICIPAL DE INFORMÁTICA - EMPREL</div>
                                    <div class="text-muted">VAN CONECTA ITINERANTE</div>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <a class="btn btn-primary" href="/home">Início</a>
                                <button class="btn btn-secondary" id="btn_voltar" onclick="history.back()">Voltar</button>
                                <a class="btn btn-danger" href="#" id="btn_logout">Sair</a>
                            </div>
                        </div>
                    </div>
                </div>

                {% block conteudo %}
                {% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/session.js"></script>
    {% block scripts_extras %}{% endblock %}
</body>
</html>
