<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RG Solicitados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>RG Solicitados</h4>
                <small>Login</small>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Login (CPF):</label>
                    <input type="text" class="form-control" id="login_cpf" placeholder="000.000.000-00" autocomplete="off" maxlength="14">
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha:</label>
                    <input type="password" class="form-control" id="login_senha" placeholder="Senha">
                </div>
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="login_mostrar_senha">
                        <label class="form-check-label" for="login_mostrar_senha">Mostrar senha</label>
                    </div>
                </div>
                <div id="login_error" class="alert alert-danger d-none"></div>
                <button class="btn btn-primary w-100" id="btn_login">Entrar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
