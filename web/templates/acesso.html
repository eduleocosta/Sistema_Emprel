{% extends "base.html" %}

{% block titulo_pagina %}Acesso - RG Solicitados{% endblock %}

{% block links_extras %}
<style>
    #modal_usuario .modal-body { padding: 1.25rem; }
    .table td, .table th { vertical-align: middle; }
</style>
{% endblock %}

{% block conteudo %}
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Acesso</h2>
            <button class="btn btn-success d-none" id="btn_novo_usuario">Novo Usuário</button>
        </div>

        <div class="card mb-4 d-none" id="card_lista_usuarios">
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="pesquisa_usuario" placeholder="Pesquisar por nome ou CPF...">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="tabela_usuarios">
                        <thead>
                            <tr>
                                <th>CPF</th>
                                <th>Nome</th>
                                <th>Perfil</th>
                                <th>E-mail</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbody_usuarios"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card mb-4 d-none" id="card_meus_dados">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">CPF</label>
                        <input type="text" class="form-control" id="meu_cpf" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" id="meu_nome">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="meu_email">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Data Nascimento</label>
                        <input type="text" class="form-control" id="meu_dn" placeholder="DD/MM/AAAA" maxlength="10">
                    </div>
                </div>
                <div class="mt-3">
                    <button class="btn btn-primary" id="btn_salvar_meus_dados">Salvar Meus Dados</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal_usuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal_usuario_titulo">Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="form_usuario" class="row g-3">
                        <input type="hidden" id="usuario_cpf">
                        <div class="col-md-12">
                            <label class="form-label">CPF</label>
                            <input type="text" class="form-control" id="usuario_cpf_visual" placeholder="000.000.000-00" maxlength="14" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" id="usuario_nome" placeholder="Nome completo" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Perfil</label>
                            <select class="form-select" id="usuario_perfil">
                                <option value="admin">Admin</option>
                                <option value="user">Usuário</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Data Nascimento</label>
                            <input type="text" class="form-control" id="usuario_dn" placeholder="DD/MM/AAAA" maxlength="10">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="usuario_email" placeholder="email@exemplo.com">
                        </div>
                        <div class="col-md-12" id="campo_senha_container">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control" id="usuario_senha" placeholder="Senha">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn_salvar_usuario">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal_senha" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Redefinir Senha</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="form_senha">
                        <input type="hidden" id="senha_cpf">
                        <div class="mb-3">
                            <label class="form-label">Nova senha</label>
                            <input type="password" class="form-control" id="nova_senha" placeholder="Nova senha" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirmar senha</label>
                            <input type="password" class="form-control" id="confirmar_senha" placeholder="Confirmar senha" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn_salvar_senha">Salvar</button>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts_extras %}
    <script src="/static/js/acesso.js"></script>
{% endblock %}
