{% extends "base.html" %}

{% block titulo_pagina %}Backup - RG Solicitados{% endblock %}

{% block conteudo %}
    <div class="container-fluid mt-4">
        <h2>Backup</h2>

        <div class="card mb-4">
            <div class="card-header bg-white"><strong>Backup Local</strong></div>
            <div class="card-body">
                <p>Crie um backup dos dados do sistema no computador.</p>
                <button class="btn btn-primary" id="btn_fazer_backup">Fazer Backup</button>
                <div id="backup_result" class="mt-3"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-white"><strong>Backups Disponíveis</strong></div>
            <div class="card-body">
                <div id="lista_backups">
                    <p class="text-muted">Nenhum backup encontrado.</p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts_extras %}
    <script src="/static/js/backup.js"></script>
{% endblock %}
