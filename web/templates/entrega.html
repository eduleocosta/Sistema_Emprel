{% extends "base.html" %}

{% block titulo_pagina %}Entrega de RG - RG Solicitados{% endblock %}

{% block conteudo %}
    <div class="container-fluid mt-4">
        <h2>Entrega de RG</h2>

        <div class="card mb-4">
            <div class="card-header bg-white"><strong>Registrar Entrega</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Protocolo</label>
                        <input type="text" class="form-control" id="ent_entrega_protocolo" placeholder="Protocolo">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" id="ent_entrega_nome" placeholder="Nome">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">CPF</label>
                        <input type="text" class="form-control" id="ent_entrega_cpf" placeholder="CPF">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="ent_entrega_telefone" placeholder="Telefone">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Data da Ação</label>
                        <input type="text" class="form-control" id="ent_entrega_data" placeholder="DD/MM/AAAA">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Ação</label>
                        <input type="text" class="form-control" id="ent_entrega_acao" placeholder="Ação">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Operador</label>
                        <input type="text" class="form-control" id="ent_entrega_operador" placeholder="Nome do operador">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-success" id="btn_salvar_entrega">Salvar Entrega</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-white"><strong>Entregas Registradas</strong></div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="tabela_entregas">
                        <thead>
                            <tr>
                                <th>Protocolo</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>Data</th>
                                <th>Ação</th>
                                <th>Operador</th>
                                <th>Data Entrega</th>
                            </tr>
                        </thead>
                        <tbody id="tbody_entregas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts_extras %}
    <script src="/static/js/entrega.js"></script>
{% endblock %}
