{% extends "base.html" %}

{% block titulo_pagina %}Cadastro - RG Solicitados{% endblock %}

{% block conteudo %}
    <div class="container-fluid mt-4">
        <h2>Cadastro</h2>

        <div class="card mb-4">
            <div class="card-header bg-white"><strong>Protocolo</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Protocolo</label>
                        <input type="text" class="form-control" id="ent_protocolo" placeholder="Protocolo">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">CPF</label>
                        <input type="text" class="form-control" id="ent_cpf" placeholder="CPF">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" id="ent_nome" placeholder="Nome">
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-white"><strong>Telefone</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Telefone</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="ent_tel" placeholder="Telefone">
                            <button class="btn btn-outline-success" type="button" id="btn_add_tel" title="Adicionar telefone extra">+</button>
                            <div class="form-check align-self-center ms-3">
                                <input class="form-check-input" type="checkbox" id="chk_sem_tel">
                                <label class="form-check-label" for="chk_sem_tel">Não informado</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="tel_extra_container"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-white"><strong>Ação e Serviço</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Data</label>
                        <input type="text" class="form-control" id="ent_data" placeholder="DD/MM/AAAA">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Ação</label>
                        <select class="form-select" id="ent_acao">
                            <option value="">Selecionar...</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Serviço</label>
                        <select class="form-select" id="ent_servico">
                            <option value="">Selecionar...</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary" id="btn_selecionar_acao_servico">Selecionar Ação/Serviço</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <button class="btn btn-success" id="btn_salvar">Salvar</button>
            <button class="btn btn-danger" id="btn_excluir">Excluir</button>
            <button class="btn btn-secondary" id="btn_limpar">Limpar</button>
        </div>

        <div class="card">
            <div class="card-header bg-white"><strong>Cadastros</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="pesquisa_protocolo" placeholder="Pesquisar por protocolo...">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary" id="btn_pesquisar">Pesquisar</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="tabela_cadastros">
                        <thead>
                            <tr>
                                <th>Protocolo</th>
                                <th>CPF</th>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th>Data</th>
                                <th>Ação</th>
                                <th>Serviço</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbody_cadastros"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts_extras %}
    <script src="/static/js/cadastro.js"></script>
{% endblock %}
