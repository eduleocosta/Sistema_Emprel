{% extends "base.html" %}

{% block titulo_pagina %}Fichas - RG Solicitados{% endblock %}

{% block conteudo %}
    <div class="container-fluid mt-4">
        <h2>Geração de Fichas</h2>

        <div class="card mb-4">
            <div class="card-header bg-white"><strong>Gerar Ficha</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Protocolo</label>
                        <input type="text" class="form-control" id="ficha_protocolo" placeholder="Protocolo">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button class="btn btn-primary" id="btn_gerar_ficha">Gerar Ficha</button>
                    </div>
                </div>
                <div id="ficha_preview" class="mt-3"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-white"><strong>Fichas Geradas</strong></div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="tabela_fichas">
                        <thead>
                            <tr>
                                <th>Protocolo</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Data</th>
                                <th>Ação</th>
                                <th>Serviço</th>
                            </tr>
                        </thead>
                        <tbody id="tbody_fichas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts_extras %}
    <script src="/static/js/fichas.js"></script>
{% endblock %}
